<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Practice Partner</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { background: #007bff; color: white; border: none; padding: 15px 30px; border-radius: 25px; font-size: 18px; cursor: pointer; }
    button.recording { background: #dc3545; }
    .box { margin-top: 15px; padding: 10px; background: #eee; border-radius: 8px; text-align: left; }
  </style>
</head>
<body>
  <div class="card">
    <h2>EchoTalk Partner</h2>
    <p>Tap below and start speaking:</p>
    <button id="micBtn">🎤 Hold to Speak</button>

    <div class="box">
      <strong>You said:</strong> <p id="userText">...</p>
    </div>
    <div class="box">
      <strong>Partner:</strong> <p id="botText">...</p>
    </div>
    <audio id="audioPlayer" controls style="width: 100%; margin-top: 15px;"></audio>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    const micBtn = document.getElementById('micBtn');

    micBtn.addEventListener('click', async () => {
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = sendAudioToBackend;

        mediaRecorder.start();
        micBtn.innerText = "🛑 Stop & Send";
        micBtn.classList.add("recording");
      } else {
        mediaRecorder.stop();
        micBtn.innerText = "🎤 Hold to Speak";
        micBtn.classList.remove("recording");
      }
    });

    async function sendAudioToBackend() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
      const formData = new FormData();
      formData.append('file', audioBlob, 'voice.wav');

      document.getElementById('userText').innerText = "Processing...";

      const res = await fetch('/api/chat', { method: 'POST', body: formData });
      const data = await res.json();

      document.getElementById('userText').innerText = data.user_transcript;
      document.getElementById('botText').innerText = data.bot_reply;
      
      const player = document.getElementById('audioPlayer');
      player.src = data.audio_url + "?t=" + new Date().getTime(); // Prevent caching
      player.play();
    }
  </script>
</body>
</html>
